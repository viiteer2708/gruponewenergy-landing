<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <link rel="icon" type="image/png" href="/favicon-gnew.png">
    <title>Tramitaciones | Grupo New Energy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary: #0B6E4F;
            --primary-dark: #094D38;
            --primary-light: #0D8A63;
            --accent: #F9A825;
            --bg: #F5F7FA;
            --card-bg: #FFFFFF;
            --text: #1A1A2E;
            --text-muted: #6B7280;
            --border: #E2E8F0;
            --error: #DC2626;
            --shadow: 0 4px 6px -1px rgba(0,0,0,.07), 0 2px 4px -2px rgba(0,0,0,.05);
            --shadow-lg: 0 10px 25px -5px rgba(0,0,0,.1), 0 8px 10px -6px rgba(0,0,0,.07);
            --radius: 12px;
            --radius-sm: 8px;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        button, input {
            font: inherit;
            color: inherit;
        }

        :focus-visible {
            outline: 3px solid rgba(249, 168, 37, .75);
            outline-offset: 2px;
        }

        /* ===== CABECERA ===== */
        .cabecera {
            position: sticky;
            top: 0;
            z-index: 20;
            background: #fff;
            border-bottom: 1px solid var(--border);
        }

        .cabecera-in {
            max-width: 1200px;
            margin: 0 auto;
            padding: .6rem 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: .75rem;
        }

        .marca {
            display: flex;
            align-items: center;
            gap: .7rem;
            min-width: 0;
            color: inherit;
        }

        .marca-logo {
            display: flex;
            flex: none;
        }

        .marca img {
            height: 36px;
            width: auto;
            flex: none;
        }

        .marca-texto {
            min-width: 0;
            line-height: 1.2;
        }

        .marca-titulo {
            display: block;
            color: inherit;
            text-decoration: none;
        }

        .marca-texto h1 {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--primary-dark);
        }

        /* Quién ha entrado: «NOMBRE · correo» (con «…» si no cabe) y, a su lado o, en el móvil, debajo, el enlace para cambiar el nombre.
           El enlace va FUERA del <a> del título: un enlace dentro de otro no es HTML válido */
        .quien {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 0 .6rem;
            font-size: .75rem;
        }

        .quien-texto {
            min-width: 0;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--text-muted);
        }

        .quien-texto strong {
            font-weight: 600;
            color: var(--text);
        }

        .cambiar-nombre {
            flex: none;
            padding: .15rem 0;
            font-weight: 600;
            color: var(--primary);
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        .acciones-cabecera {
            display: flex;
            align-items: center;
            gap: .5rem;
            flex: none;
        }

        .btn-icono {
            width: 40px;
            height: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            background: #fff;
            color: var(--primary-dark);
            cursor: pointer;
        }

        .btn-icono:hover:not(:disabled) {
            border-color: var(--primary);
            background: #F0FAF6;
        }

        .btn-icono:disabled {
            opacity: .5;
            cursor: default;
        }

        .btn-salir {
            flex: none;
            min-height: 40px;
            padding: .4rem .9rem;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            background: #fff;
            font-size: .875rem;
            font-weight: 600;
            color: var(--primary-dark);
            cursor: pointer;
        }

        .btn-salir:hover {
            border-color: var(--primary);
            background: #F0FAF6;
        }

        /* ===== CONTENIDO ===== */
        .contenedor {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 1rem 3rem;
        }

        .buscador input {
            width: 100%;
            min-height: 48px;
            padding: .6rem .9rem;
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            background: #fff;
            font-size: 1rem; /* 16 px: el móvil no hace zoom al escribir */
            box-shadow: var(--shadow);
        }

        .buscador input::placeholder {
            color: #9CA3AF;
            font-size: .8125rem;
        }

        .buscador input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(11, 110, 79, .18);
        }

        /* Barra: los filtros a la izquierda y, a la derecha, el interruptor Tarjetas / Lista */
        .barra {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: .5rem .75rem;
            margin: .85rem 0 1rem;
        }

        .filtros {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            flex: 1 1 auto;
            gap: .5rem;
        }

        /* Mismo lenguaje que los chips (píldora, borde fino, activo en verde), en un solo grupo de dos botones */
        .vistas {
            display: inline-flex;
            flex: none;
            gap: .15rem;
            margin-left: auto;
            padding: 3px;
            border: 1.5px solid var(--border);
            border-radius: 999px;
            background: #fff;
        }

        .vista-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: .4rem;
            min-height: 30px; /* con el relleno y el borde del grupo, 38 px: lo mismo que un chip */
            padding: .2rem .75rem;
            border: 0;
            border-radius: 999px;
            background: transparent;
            font-size: .875rem;
            font-weight: 600;
            color: var(--text);
            cursor: pointer;
            white-space: nowrap;
        }

        .vista-btn svg {
            flex: none;
            width: 1rem;
            height: 1rem;
        }

        .vista-btn:hover {
            background: #F0FAF6;
        }

        .vista-btn[aria-pressed="true"] {
            background: var(--primary);
            color: #fff;
        }

        .vista-texto {
            display: none; /* en el móvil, solo el icono (el botón lleva su aria-label) */
        }

        .chip {
            min-height: 38px;
            padding: .3rem .95rem;
            border: 1.5px solid var(--border);
            border-radius: 999px;
            background: #fff;
            font-size: .875rem;
            font-weight: 600;
            color: var(--text);
            cursor: pointer;
            white-space: nowrap;
        }

        .chip:hover {
            border-color: var(--primary-light);
        }

        .chip[aria-pressed="true"] {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
        }

        .chip[hidden] {
            display: none;
        }

        .chip-mas {
            color: var(--text-muted);
            font-weight: 500;
        }


        /* ===== LISTA ===== */
        .lista {
            list-style: none;
            display: grid;
            grid-template-columns: 1fr;
            gap: .75rem;
        }

        .tarjeta {
            display: block;
            height: 100%;
            padding: .95rem 1rem;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            text-decoration: none;
            color: inherit;
            transition: border-color .15s, box-shadow .15s, transform .15s;
        }

        .tarjeta:hover {
            border-color: var(--primary-light);
            box-shadow: var(--shadow-lg);
        }

        .t-cabeza {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: .6rem;
        }

        .t-titular {
            min-width: 0;
            font-size: 1rem;
            font-weight: 700;
            line-height: 1.3;
            overflow-wrap: anywhere;
        }

        .ins {
            display: inline-block;
            flex: none;
            padding: .12rem .6rem;
            border-radius: 999px;
            font-size: .72rem;
            font-weight: 700;
            letter-spacing: .02em;
            line-height: 1.5;
            white-space: nowrap;
        }

        .estado-recibida { background: #FEF3C7; color: #92400E; }
        .estado-tramitada { background: #DCFCE7; color: #166534; }
        .estado-subiendo { background: #DBEAFE; color: #1E40AF; }
        .estado-abandonada { background: #FFEDD5; color: #9A3412; }
        .estado-descartada { background: #FEE2E2; color: #991B1B; }
        .marca-gnew { background: #E7F5EF; color: #094D38; }
        .marca-mega { background: #CCFBF1; color: #0F766E; }

        .t-linea {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: .4rem;
            margin-top: .4rem;
            font-size: .875rem;
            color: #374151;
            overflow-wrap: anywhere;
        }

        .t-cups {
            margin-top: .25rem;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: .8rem;
            color: var(--text-muted);
            letter-spacing: .02em;
            overflow-wrap: anywhere;
        }

        .t-comercial {
            margin-top: .25rem;
            font-size: .8125rem;
            color: var(--text-muted);
            overflow-wrap: anywhere;
        }

        .t-pie {
            display: flex;
            flex-wrap: wrap;
            gap: .25rem .9rem;
            margin-top: .6rem;
            padding-top: .55rem;
            border-top: 1px solid #EEF2F6;
            font-size: .8rem;
            color: var(--text-muted);
        }

        /* ===== QUIÉN HA ABIERTO LA FICHA ===== */
        /* Sin abrir (solo las pendientes): una raya azul a la izquierda (sigue azul al pasar el ratón: va después de .tarjeta:hover) y la pastilla */
        .tarjeta.sin-abrir {
            border-left: 4px solid #2563EB;
        }

        .t-vista {
            display: grid;
            gap: .25rem;
            margin-top: .5rem;
            font-size: .8125rem;
        }

        .ins-sin-abrir {
            justify-self: start;
            background: #DBEAFE;
            color: #1D4ED8;
        }

        .ins-sin-abrir::before {
            content: '';
            display: inline-block;
            width: .45rem;
            height: .45rem;
            margin-right: .4rem;
            border-radius: 50%;
            background: currentColor;
            vertical-align: .04rem;
        }

        /* Abierta: un ojo y «Abierta por <nombre> · hace 5 min» (en las aperturas de antes del nombre, el correo), una línea por persona */
        .t-abierta {
            display: flex;
            align-items: flex-start;
            gap: .4rem;
            color: #166534;
            overflow-wrap: anywhere;
        }

        .t-ojo {
            flex: none;
            width: 1rem;
            height: 1rem;
            margin-top: .1rem;
        }

        .t-resto {
            white-space: nowrap;
        }

        .mensaje {
            padding: 2rem 1rem;
            text-align: center;
            color: var(--text-muted);
            font-size: .95rem;
        }

        .mensaje.error {
            color: #991B1B;
            background: #FEF2F2;
            border: 1px solid #FECACA;
            border-radius: var(--radius);
        }

        .mensaje button {
            margin-top: .75rem;
        }

        .btn {
            min-height: 44px;
            padding: .55rem 1.4rem;
            border: 1.5px solid var(--primary);
            border-radius: var(--radius-sm);
            background: #fff;
            font-weight: 600;
            font-size: .95rem;
            color: var(--primary);
            cursor: pointer;
        }

        .btn:hover:not(:disabled) {
            background: #F0FAF6;
        }

        .btn:disabled {
            opacity: .6;
            cursor: default;
        }

        .mas {
            display: flex;
            justify-content: center;
            margin-top: 1.25rem;
        }

        .mas[hidden] {
            display: none;
        }

        /* ===== MODO LISTA (tabla) ===== */
        /* <body class="vista-lista"> lo activa; en Tarjetas no se usa nada de esto. La cabecera y cada fila comparten --cols-lista:
           las columnas quedan alineadas sin <table> y cada fila sigue siendo UN enlace a su ficha. */
        :root {
            --margen-lista: .75rem;
            --hueco-lista: .5rem;
            /* Comercial · Compañía · Titular · CUPS · Recibida · Docs · Abierta · Estado · ›
               Orden de Victor (16-oct-2026): «lo 1.º el comercial, luego compañía / titular / CUPS y resto». La raya azul de «Sin abrir» sigue en el borde
               izquierdo de la fila (junto a Comercial) y el titular conserva su píldora con las iniciales. Y (17-oct-2026): «En compañía debe salir COMPAÑÍA +
               oferta, nada más. Ajusta la siguiente columna pegada a esta para dar más espacio a la columna comercial»: la celda Compañía enseña solo
               «COMPAÑÍA · OFERTA» (sin la pastilla GNEW / MEGA ni la tarifa), su columna se ajusta a ese texto, CUPS se estrecha y todo lo que se libera va a
               Comercial. Las columnas de datos cortos siguen a lo JUSTO y no se han movido de tamaño. Medido a 1440 px con la fuente de las pruebas (DejaVu Sans,
               más ancha que Inter) y 30 filas: Recibida, «hace 59 min» 70 px (y «hace unos segundos», 115 px, se parte en dos líneas: ver .c-recibida); Docs, un
               número; Abierta, «Sin abrir» 93 px (el nombre se recorta con «…» y el title lo dice entero); Estado, «Descartada» 97 px.
               El resto del ancho (la página no pasa de 1400: la caja mide 1350 y, sin esas columnas, CUPS, los 8 huecos, los márgenes y la raya, quedan 759 px) va así:
               · Compañía, FIJA en 12,6875 rem (203 px; antes 14 rem = 224, con su pastilla y la tarifa): lo justo para lo más largo de lo frecuente, «MEGA · CLEAR 7,5
                 (INDEXADO)» (202,2 px; «NET · FIJO POWER PLUS (FIJO)» mide 192,0). Lo más largo («NET · FIJO POWER PLUS PRIORITY (FIJO)», 255,8 px; «NET FIJO BOE · NET
                 FIJO BOE TRAMOS», 244,9; y los contratos del formulario MEGA, cuya compañía es siempre «MEGA ENERGIA»: «MEGA ENERGIA · CLEAR 7,5 (INDEXADO)», 264,3) acaba
                 en «…» y el title lo dice entero. Fija y no `fr`: así no le sobra sitio (no le sirve) ni se corta cuando la ventana encoge.
               · CUPS, FIJA en 8,5625 rem (137 px; antes 9,5 rem = 152): el CUPS completo, de 22 caracteres («ES0027700137431001MC0F»), en monoespaciada de 11 px (antes 11,2)
                 con el espaciado a -.04em mide 136,0 px (antes 148,2). De 11 px de letra no se baja; con -.05em los dígitos ya se pegan.
               · Comercial y Titular, lo que queda (556 px; antes 520: se han liberado 21 de Compañía y 15 de CUPS) en 9 : 10 → 263,4 y 292,6 px (antes, en 7 : 9, 227,5 y
                 292,5): todo lo liberado va a Comercial y Titular se queda igual. Letras A-Z en mayúscula que caben (el peor caso: los nombres de verdad, con I, L, J y
                 espacios, caben más): Comercial, 30,1 (antes 26,0); Titular, 28,0 y 24,9 en las filas «Sin abrir», con el titular en negrita, más ancha (antes 27,9 y 24,9).
                 Se leen enteros «ISABEL HERNANDEZ GALLEGO LOPEZ» (30 caracteres), «JOSE MANUEL FERNANDEZ SL» (24, también en negrita), «NET · FIJO POWER PLUS (FIJO)» y el
                 CUPS de 22 caracteres.
               La caja ya no se desliza hasta ventanas de ~1115 px (antes, ~1150). */
            --cols-lista: minmax(7rem, 9fr) 12.6875rem minmax(10rem, 10fr) 8.5625rem 4.75rem 2.25rem 8.5rem 6.25rem .875rem;
            /* Por debajo de este ancho la caja se desliza de lado: la suma de los mínimos de --cols-lista (60,875 rem) + los 8 huecos + los márgenes + la raya */
            --ancho-lista: calc(60.875rem + 8 * var(--hueco-lista) + 2 * var(--margen-lista) + 4px);
        }

        .caja-lista[hidden] {
            display: none;
        }

        .tabla-cabecera {
            display: none;
        }

        body.vista-lista .cabecera-in,
        body.vista-lista .contenedor {
            max-width: 1400px;
        }

        body.vista-lista .caja-lista {
            overflow-x: auto;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        body.vista-lista .lista {
            display: block;
        }

        body.vista-lista .tabla-cabecera,
        body.vista-lista .lista {
            min-width: var(--ancho-lista);
        }

        body.vista-lista .tabla-cabecera {
            display: grid;
            grid-template-columns: var(--cols-lista);
            column-gap: var(--hueco-lista);
            align-items: center;
            padding: .7rem var(--margen-lista) .7rem calc(var(--margen-lista) + 4px); /* los 4 px de más son la raya de las filas: columnas alineadas */
            background: #F8FAFC;
            border-bottom: 1px solid #EEF2F6;
            font-size: .75rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        .tabla-cabecera span {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .fila {
            display: grid;
            grid-template-columns: var(--cols-lista);
            column-gap: var(--hueco-lista);
            align-items: center;
            min-height: 56px;
            padding: .4rem var(--margen-lista);
            border-left: 4px solid transparent; /* en todas las filas, para que las columnas no se muevan; azul en «Sin abrir» */
            border-bottom: 1px solid #EEF2F6;
            font-size: .8125rem;
            color: #374151;
            text-decoration: none;
            transition: background-color .15s;
        }

        .lista li:last-child .fila {
            border-bottom: 0;
        }

        .fila:hover {
            background: #F8FAFC;
        }

        .fila:focus-visible {
            outline-offset: -3px; /* hacia dentro: la caja se desliza y recortaría el aro de fuera */
        }

        .fila.sin-abrir {
            border-left-color: #2563EB;
        }

        .fila > .c {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .c-titular, .c-abierta, .c-estado, .c-ir {
            display: flex;
            align-items: center;
        }

        .c-recibida {
            font-size: .7rem;
            color: var(--text-muted);
        }

        /* Recibida es una columna estrecha: «hace unos segundos» (solo los primeros 45 s) se parte en dos líneas en vez de cortarse con «…» */
        .fila > .c-recibida {
            white-space: normal;
            line-height: 1.25;
        }

        .c-cups {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: .6875rem; /* 11 px: de aquí no se baja */
            letter-spacing: -.04em;
            color: #4B5563;
        }

        .c-docs {
            font-weight: 700;
            color: var(--text);
        }

        /* Titular: una píldora con borde, el círculo de las iniciales y el nombre (con «…» si no cabe) */
        .pildora {
            display: inline-flex;
            align-items: center;
            gap: .45rem;
            min-width: 0;
            max-width: 100%;
            padding: .15rem .75rem .15rem .2rem;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: #fff;
            box-shadow: 0 1px 2px rgba(15, 23, 42, .05);
        }

        .avatar {
            flex: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 1.5rem;
            height: 1.5rem;
            border-radius: 50%;
            font-size: .625rem;
            font-weight: 700;
            line-height: 1;
        }

        .avatar-gnew { background: var(--primary); color: #fff; }
        .avatar-mega { background: #14B8A6; color: #042F2E; }

        .pildora-nombre {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: 500;
            color: var(--text);
        }

        .fila.sin-abrir .pildora-nombre {
            font-weight: 700;
        }

        /* Abierta: el ojo y, en dos líneas, quién (el nombre; lo que se recorta con «…») y debajo su «hace 5 min» y «+N» si hubo más personas */
        .c-abierta {
            gap: .4rem;
            color: #166534;
        }

        .c-abierta .t-ojo {
            margin-top: 0;
        }

        .a-texto {
            display: flex;
            flex-direction: column;
            min-width: 0;
            line-height: 1.3;
        }

        .a-correo {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: 600;
        }

        .a-linea {
            display: flex;
            align-items: center;
            gap: .4rem;
            font-size: .72rem;
            color: var(--text-muted);
            white-space: nowrap;
        }

        /* Abierta es estrecha: «hace unos segundos» (solo los primeros 45 s) acaba en «…» en vez de cortarse en seco */
        .a-linea .t-cuando {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .a-mas {
            padding: 0 .4rem;
            border-radius: 999px;
            background: #F1F5F9;
            font-weight: 600;
        }

        /* Pastillas de la tabla: fondo claro y borde fino del mismo tono */
        .fila .ins { border: 1px solid transparent; }
        .fila .estado-recibida { border-color: #FCD34D; }
        .fila .estado-tramitada { border-color: #86EFAC; }
        .fila .estado-subiendo { border-color: #93C5FD; }
        .fila .estado-abandonada { border-color: #FDBA74; }
        .fila .estado-descartada { border-color: #FCA5A5; }
        .fila .ins-sin-abrir { border-color: #93C5FD; }

        /* ›: lo dibuja el CSS (sin SVG: en la tabla el único dibujo es el ojo) */
        .c-ir {
            justify-content: flex-end;
            color: #9CA3AF;
        }

        .c-ir::after {
            content: '';
            width: .45rem;
            height: .45rem;
            margin-right: .2rem;
            border-top: 2px solid currentColor;
            border-right: 2px solid currentColor;
            transform: rotate(45deg);
        }

        .fila:hover .c-ir {
            color: var(--primary);
        }

        @media (min-width: 700px) {
            .lista { grid-template-columns: repeat(2, 1fr); }
            .cabecera-in, .contenedor { padding-left: 1.5rem; padding-right: 1.5rem; }
            .vista-texto { display: inline; }
            .vista-btn { padding: .2rem .95rem; }
        }

        @media (min-width: 1100px) {
            .lista { grid-template-columns: repeat(3, 1fr); }
            .buscador { max-width: 560px; }
        }
    </style>
</head>
<body>

<header class="cabecera">
    <div class="cabecera-in">
        <div class="marca">
            <a class="marca-logo" href="/bandeja" tabindex="-1"><img src="/logo-gnew.png" alt="Grupo New Energy"></a>
            <div class="marca-texto">
                <a class="marca-titulo" href="/bandeja"><h1>Tramitaciones</h1></a>
                <div class="quien">
                    <span class="quien-texto" id="quien"><strong id="nombre" hidden></strong><span id="separador" hidden> · </span><span id="correo"></span></span>
                    <a class="cambiar-nombre" id="cambiarNombre" href="/bandeja/entrar?paso=nombre&amp;volver=%2Fbandeja">Cambiar nombre</a>
                </div>
            </div>
        </div>
        <div class="acciones-cabecera">
            <button class="btn-icono" id="btnActualizar" type="button" aria-label="Actualizar la lista" title="Actualizar la lista">
                <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
            </button>
            <button class="btn-salir" id="btnSalir" type="button">Salir</button>
        </div>
    </div>
</header>

<main class="contenedor">
    <div class="buscador">
        <input id="q" type="search" placeholder="Buscar por titular, CUPS o comercial" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Buscar por titular, CUPS o comercial">
    </div>

    <div class="barra">
        <div class="filtros" id="filtros" role="group" aria-label="Filtrar por estado">
            <button class="chip" type="button" data-estado="pendientes" aria-pressed="true">Pendientes</button>
            <button class="chip" type="button" data-estado="tramitadas" aria-pressed="false">Tramitadas</button>
            <button class="chip" type="button" data-estado="incompletas" aria-pressed="false">Incompletas</button>
            <button class="chip" type="button" data-estado="todas" aria-pressed="false">Todas</button>
            <button class="chip chip-mas" type="button" id="chipMas" aria-expanded="false">Más</button>
            <button class="chip" type="button" data-estado="descartadas" aria-pressed="false" id="chipDescartadas" hidden>Descartadas</button>
        </div>
        <div class="vistas" role="group" aria-label="Modo de visualización">
            <button class="vista-btn" type="button" id="btnVistaTarjetas" data-vista="tarjetas" aria-pressed="true" aria-label="Tarjetas">
                <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
                <span class="vista-texto">Tarjetas</span>
            </button>
            <button class="vista-btn" type="button" id="btnVistaLista" data-vista="lista" aria-pressed="false" aria-label="Lista">
                <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg>
                <span class="vista-texto">Lista</span>
            </button>
        </div>
    </div>

    <p class="mensaje" id="estadoLista" role="status" aria-live="polite">Cargando…</p>
    <div class="caja-lista" id="cajaLista" hidden>
        <div class="tabla-cabecera" aria-hidden="true">
            <span>Comercial</span>
            <span>Compañía · Oferta</span>
            <span>Titular</span>
            <span>CUPS</span>
            <span>Recibida</span>
            <span>Docs</span>
            <span>Abierta</span>
            <span>Estado</span>
            <span></span>
        </div>
        <ul class="lista" id="lista"></ul>
    </div>
    <div class="mas" id="mas" hidden>
        <button class="btn" type="button" id="btnMas">Cargar más</button>
    </div>
</main>

<script>
(function () {
    'use strict';

    var ETIQUETA_ESTADO = { recibida: 'Pendiente', tramitada: 'Tramitada', subiendo: 'Subiendo', abandonada: 'Incompleta', descartada: 'Descartada' };
    var ETIQUETA_MARCA = { gnew: 'GNEW', mega: 'MEGA' };
    var FILTROS = ['pendientes', 'tramitadas', 'incompletas', 'todas', 'descartadas'];
    var VISTAS = ['tarjetas', 'lista'];
    var MAX_VISTAS = 3;      // personas que se enseñan en una tarjeta («Abierta por …»)

    var inputQ = document.getElementById('q');
    var cajaFiltros = document.getElementById('filtros');
    var chips = cajaFiltros.querySelectorAll('.chip[data-estado]');
    var chipMas = document.getElementById('chipMas');
    var chipDescartadas = document.getElementById('chipDescartadas');
    var btnsVista = document.querySelectorAll('.vistas [data-vista]');
    var btnActualizar = document.getElementById('btnActualizar');
    var cajaLista = document.getElementById('cajaLista');
    var listaEl = document.getElementById('lista');
    var estadoLista = document.getElementById('estadoLista');
    var cajaMas = document.getElementById('mas');
    var btnMas = document.getElementById('btnMas');

    var estado = 'pendientes';
    var vista = 'tarjetas';  // cómo se enseña la lista: 'tarjetas' o 'lista' (tabla); se recuerda en este navegador
    var cargados = [];       // lo ya recibido (con las páginas de «Cargar más»): cambiar de modo lo repinta sin volver a pedirlo
    var siguiente = null;
    var ticket = 0;          // para ignorar respuestas viejas si el usuario cambia de filtro mientras se carga
    var ultimaCarga = 0;
    var temporizador = null;

    // ---------- utilidades ----------
    function el(etiqueta, clase, texto) {
        var e = document.createElement(etiqueta);
        if (clase) e.className = clase;
        if (texto !== undefined && texto !== null) e.textContent = texto;
        return e;
    }

    var FORMATO_FECHA = new Intl.DateTimeFormat('es-ES', { timeZone: 'Europe/Madrid', day: 'numeric', month: 'numeric', year: 'numeric' });
    function fechaCorta(iso) {
        var t = Date.parse(iso);
        if (!isFinite(t)) return '';
        var p = {};
        FORMATO_FECHA.formatToParts(new Date(t)).forEach(function (x) { p[x.type] = x.value; });
        return p.day + '-' + p.month + '-' + p.year;
    }

    // «hace 12 min» (hasta una semana) y, a partir de ahí, la fecha
    function hace(iso) {
        var t = Date.parse(iso);
        if (!isFinite(t)) return '';
        var seg = Math.max(0, Math.round((Date.now() - t) / 1000));
        if (seg < 45) return 'hace unos segundos';
        var min = Math.round(seg / 60);
        if (min < 60) return 'hace ' + min + ' min';
        var h = Math.round(min / 60);
        if (h < 24) return 'hace ' + h + ' h';
        var d = Math.round(h / 24);
        if (d < 7) return 'hace ' + d + (d === 1 ? ' día' : ' días');
        return fechaCorta(iso);
    }

    // Una sola vez: la lista y «quién soy» pueden recibir el 401 (o el «sin nombre») a la vez y la segunda navegación abortaría la primera
    var redirigiendo = false;
    function irALogin() {
        if (redirigiendo) return;
        redirigiendo = true;
        location.replace('/bandeja/entrar?volver=' + encodeURIComponent(location.pathname + location.search));
    }

    // La sesión no tiene nombre (la primera vez, o una sesión de antes del nombre): se pide en el paso del nombre y se vuelve aquí
    function irAlNombre() {
        if (redirigiendo) return;
        redirigiendo = true;
        location.replace('/bandeja/entrar?paso=nombre&volver=' + encodeURIComponent(location.pathname + location.search));
    }

    // «Cambiar nombre» vuelve a esta misma dirección (con el filtro de ahora: se actualiza cuando cambia)
    var enlaceNombre = document.getElementById('cambiarNombre');
    function ponerEnlaceNombre() {
        enlaceNombre.href = '/bandeja/entrar?paso=nombre&volver=' + encodeURIComponent(location.pathname + location.search);
    }

    // «NOMBRE · correo» bajo el título (sin nombre, solo el correo, como antes)
    function pintarQuien(nombre, email) {
        var elNombre = document.getElementById('nombre');
        var separador = document.getElementById('separador');
        elNombre.textContent = nombre || '';
        elNombre.hidden = !nombre;
        separador.hidden = !nombre;
        document.getElementById('correo').textContent = email || '';
        document.getElementById('quien').title = [nombre, email].filter(Boolean).join(' · ');
    }

    // GET/POST con la cookie. Devuelve {status, json}; sin red, {red: true}. Nunca lanza.
    function api(ruta, cuerpo) {
        var opciones = { method: cuerpo === undefined ? 'GET' : 'POST', credentials: 'same-origin', headers: {} };
        if (cuerpo !== undefined) {
            opciones.headers['Content-Type'] = 'application/json';
            opciones.body = JSON.stringify(cuerpo);
        }
        return fetch(ruta, opciones).then(function (r) {
            return r.json().catch(function () { return null; }).then(function (json) {
                return { status: r.status, json: json };
            });
        }, function () {
            return { red: true };
        });
    }

    // ---------- tarjetas ----------
    // Un ojo pequeño (SVG en línea, siempre el mismo dibujo): decora, no dice nada que no diga ya el texto
    function ojo() {
        var NS = 'http://www.w3.org/2000/svg';
        var svg = document.createElementNS(NS, 'svg');
        var atributos = { 'class': 't-ojo', viewBox: '0 0 24 24', width: '16', height: '16', fill: 'none', stroke: 'currentColor',
            'stroke-width': '2', 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'aria-hidden': 'true', focusable: 'false' };
        Object.keys(atributos).forEach(function (k) { svg.setAttribute(k, atributos[k]); });
        var contorno = document.createElementNS(NS, 'path');
        contorno.setAttribute('d', 'M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z');
        var pupila = document.createElementNS(NS, 'circle');
        pupila.setAttribute('cx', '12');
        pupila.setAttribute('cy', '12');
        pupila.setAttribute('r', '3');
        svg.appendChild(contorno);
        svg.appendChild(pupila);
        return svg;
    }

    // «Abierta por <nombre> · hace 5 min» (en las aperturas de antes del nombre, el correo). El «hace …» lleva su fecha en data-fecha:
    // actualizarHoras() lo mantiene al día
    function lineaAbierta(v) {
        var linea = el('div', 't-abierta');
        linea.appendChild(ojo());
        var texto = el('span');
        texto.appendChild(document.createTextNode('Abierta por '));
        texto.appendChild(el('strong', null, String((v && v.por) || '')));
        if (v && v.en) {
            texto.appendChild(document.createTextNode(' '));
            var resto = el('span', 't-resto', '· '); // el «·» y el «hace …» van juntos: si la línea se parte, pasan enteros a la siguiente
            var cuando = el('span', 't-cuando', hace(v.en));
            cuando.setAttribute('data-fecha', v.en);
            resto.appendChild(cuando);
            texto.appendChild(resto);
        }
        linea.appendChild(texto);
        return linea;
    }

    function tarjeta(it) {
        var vistas = Array.isArray(it.vistas) ? it.vistas : [];
        // «Sin abrir» solo en las pendientes: en una tramitada, una incompleta o una descartada que nadie ha abierto se contradiría con su estado
        var sinAbrir = vistas.length === 0 && it.estado === 'recibida';
        var li = el('li');
        var a = el('a', 'tarjeta' + (sinAbrir ? ' sin-abrir' : ''));
        a.href = '/bandeja/c/' + encodeURIComponent(it.ref);

        var cabeza = el('div', 't-cabeza');
        cabeza.appendChild(el('span', 't-titular', it.titular_nombre || 'Sin titular'));
        cabeza.appendChild(el('span', 'ins estado-' + it.estado, ETIQUETA_ESTADO[it.estado] || ''));
        a.appendChild(cabeza);

        var empresa = [it.compania, it.tarifa].filter(Boolean).join(' · ');
        var linea = el('div', 't-linea');
        if (ETIQUETA_MARCA[it.formulario]) linea.appendChild(el('span', 'ins marca-' + it.formulario, ETIQUETA_MARCA[it.formulario]));
        if (empresa) linea.appendChild(el('span', null, empresa));
        a.appendChild(linea);

        if (it.cups) a.appendChild(el('div', 't-cups', it.cups));
        if (it.comercial_nombre) a.appendChild(el('div', 't-comercial', 'Comercial: ' + it.comercial_nombre));

        var pie = el('div', 't-pie');
        var cuando = el('span', 't-cuando', hace(it.recibida_en || it.creada_en));
        cuando.setAttribute('data-fecha', it.recibida_en || it.creada_en || '');
        pie.appendChild(cuando);
        var n = Number(it.n_documentos) || 0;
        pie.appendChild(el('span', null, n + (n === 1 ? ' documento' : ' documentos')));
        a.appendChild(pie);

        // Quién ha abierto la ficha: una pendiente que nadie ha abierto → «Sin abrir»; si alguien la ha abierto (en cualquier estado) →
        // una línea por persona, las más recientes primero; cualquier otra que nadie ha abierto no lleva esta fila
        if (sinAbrir || vistas.length > 0) {
            var vista = el('div', 't-vista');
            if (sinAbrir) {
                vista.appendChild(el('span', 'ins ins-sin-abrir', 'Sin abrir'));
            } else {
                for (var j = 0; j < vistas.length && j < MAX_VISTAS; j++) vista.appendChild(lineaAbierta(vistas[j]));
            }
            a.appendChild(vista);
        }

        li.appendChild(a);
        return li;
    }

    // ---------- filas (modo Lista) ----------
    var PALABRAS_SUELTAS = ['de', 'del', 'la', 'las', 'el', 'los', 'y', 'e', 'en']; // no dan inicial: «Casa de Pepe» → CP

    // Las iniciales del titular para el círculo («Titular de Prueba SL» → TP): la primera letra o cifra de cada palabra, dos como máximo
    function iniciales(nombre) {
        var palabras = String(nombre || '').split(/\s+/);
        var letras = '';
        for (var k = 0; k < palabras.length && letras.length < 2; k++) {
            if (PALABRAS_SUELTAS.indexOf(palabras[k].toLowerCase()) !== -1) continue;
            var m = palabras[k].match(/[A-Za-z0-9À-ÖØ-öø-ÿ]/);
            if (m) letras += m[0];
        }
        return letras ? letras.toUpperCase() : '?';
    }

    // Una fila de la tabla: lo mismo que la tarjeta, en columnas (Comercial · Compañía · Titular · CUPS · Recibida · Docs · Abierta · Estado · ›;
    // el mismo orden que la cabecera y que --cols-lista: lo 1.º el comercial, Victor, 16-oct-2026). La tarjeta no cambia: sigue con su pastilla y
    // «compañía · tarifa»; la celda Compañía de la tabla enseña «compañía · oferta».
    // La referencia (GNE-…/MEGA-…) no se enseña en ninguna columna: solo va en la dirección de la ficha (Victor, 16-oct-2026)
    function fila(it) {
        var vistas = Array.isArray(it.vistas) ? it.vistas : [];
        // La MISMA regla que la tarjeta: «Sin abrir» solo en las pendientes
        var sinAbrir = vistas.length === 0 && it.estado === 'recibida';
        var li = el('li');
        var a = el('a', 'fila' + (sinAbrir ? ' sin-abrir' : ''));
        a.href = '/bandeja/c/' + encodeURIComponent(it.ref);

        // Comercial: lo primero; si el nombre se recorta con «…», el title lo dice entero
        var celdaComercial = el('span', 'c c-comercial', it.comercial_nombre || '');
        if (it.comercial_nombre) celdaComercial.title = it.comercial_nombre;
        a.appendChild(celdaComercial);

        // Compañía · Oferta: «NET · FIJO POWER PLUS (FIJO)» y nada más (Victor, 17-oct-2026): ni la pastilla GNEW / MEGA ni la tarifa; sin oferta, solo la
        // compañía; sin ninguna de las dos, la celda vacía. Si se recorta con «…», el title lo dice entero (como en las demás celdas)
        var companiaOferta = [it.compania, it.oferta].filter(Boolean).join(' · ');
        var celdaCompania = el('span', 'c c-compania', companiaOferta);
        if (companiaOferta) celdaCompania.title = companiaOferta;
        a.appendChild(celdaCompania);

        // Titular: una píldora con el círculo de las iniciales (verde GNEW / turquesa MEGA) y el nombre
        var nombre = it.titular_nombre || 'Sin titular';
        var celdaTitular = el('span', 'c c-titular');
        var pildora = el('span', 'pildora');
        pildora.title = nombre;
        pildora.appendChild(el('span', 'avatar avatar-' + (it.formulario === 'mega' ? 'mega' : 'gnew'), it.titular_nombre ? iniciales(it.titular_nombre) : '?'));
        pildora.appendChild(el('span', 'pildora-nombre', nombre));
        celdaTitular.appendChild(pildora);
        a.appendChild(celdaTitular);

        a.appendChild(el('span', 'c c-cups', it.cups || ''));

        // Recibida: el «hace …» lleva su fecha en data-fecha, así actualizarHoras() lo mantiene al día también aquí
        var cuando = el('span', 'c c-recibida t-cuando', hace(it.recibida_en || it.creada_en));
        cuando.setAttribute('data-fecha', it.recibida_en || it.creada_en || '');
        a.appendChild(cuando);

        a.appendChild(el('span', 'c c-docs', String(Number(it.n_documentos) || 0)));

        // Abierta: una pendiente que nadie ha abierto → «Sin abrir»; si alguien la ha abierto (en cualquier estado) → el ojo, la persona
        // más reciente, su «hace …» y «+N» si fueron más (todas, en el title); cualquier otra que nadie ha abierto → celda vacía
        var celdaAbierta = el('span', 'c c-abierta');
        if (sinAbrir) {
            celdaAbierta.appendChild(el('span', 'ins ins-sin-abrir', 'Sin abrir'));
        } else if (vistas.length > 0) {
            var ultima = vistas[0];
            var texto = el('span', 'a-texto');
            texto.appendChild(el('span', 'a-correo', String((ultima && ultima.por) || '')));
            var linea = el('span', 'a-linea');
            if (ultima && ultima.en) {
                var cuandoAbierta = el('span', 't-cuando', hace(ultima.en));
                cuandoAbierta.setAttribute('data-fecha', ultima.en);
                linea.appendChild(cuandoAbierta);
            }
            if (vistas.length > 1) linea.appendChild(el('span', 'a-mas', '+' + (vistas.length - 1)));
            if (linea.firstChild) texto.appendChild(linea);
            celdaAbierta.appendChild(ojo());
            celdaAbierta.appendChild(texto);
            celdaAbierta.title = 'Abierta por ' + vistas.map(function (v) { return String((v && v.por) || ''); }).join(', ');
        }
        a.appendChild(celdaAbierta);

        var celdaEstado = el('span', 'c c-estado');
        celdaEstado.appendChild(el('span', 'ins estado-' + it.estado, ETIQUETA_ESTADO[it.estado] || ''));
        a.appendChild(celdaEstado);

        a.appendChild(el('span', 'c c-ir')); // el › lo dibuja el CSS

        li.appendChild(a);
        return li;
    }

    // ---------- modo de visualización ----------
    function pintar(it) {
        return vista === 'lista' ? fila(it) : tarjeta(it);
    }

    // Vuelve a dibujar lo ya cargado en el modo elegido, sin volver a pedirlo (siguen las páginas de «Cargar más», el filtro y la búsqueda)
    function repintar() {
        listaEl.textContent = '';
        for (var n = 0; n < cargados.length; n++) listaEl.appendChild(pintar(cargados[n]));
    }

    function leerVista() {
        var v = null;
        try { v = localStorage.getItem('bandeja.vista'); } catch (e) { /* sin almacenamiento: Tarjetas, como siempre */ }
        return VISTAS.indexOf(v) === -1 ? 'tarjetas' : v;
    }

    function aplicarVista() {
        if (vista === 'lista') document.body.classList.add('vista-lista');
        else document.body.classList.remove('vista-lista');
        for (var n = 0; n < btnsVista.length; n++) {
            btnsVista[n].setAttribute('aria-pressed', btnsVista[n].getAttribute('data-vista') === vista ? 'true' : 'false');
        }
    }

    function elegirVista(nueva) {
        if (VISTAS.indexOf(nueva) === -1 || nueva === vista) return;
        vista = nueva;
        try { localStorage.setItem('bandeja.vista', nueva); } catch (e) { /* idem: vale para esta visita */ }
        aplicarVista();
        repintar();
    }

    function actualizarHoras() {
        var celdas = listaEl.querySelectorAll('.t-cuando');
        for (var i = 0; i < celdas.length; i++) {
            var iso = celdas[i].getAttribute('data-fecha');
            if (iso) celdas[i].textContent = hace(iso);
        }
    }

    // ---------- carga ----------
    function mostrarMensaje(texto, conReintento, esError) {
        estadoLista.hidden = false;
        estadoLista.className = 'mensaje' + (esError ? ' error' : '');
        estadoLista.textContent = texto;
        if (conReintento) {
            estadoLista.appendChild(document.createElement('br'));
            var b = el('button', 'btn', 'Reintentar');
            b.type = 'button';
            b.addEventListener('click', function () { cargar(true); });
            estadoLista.appendChild(b);
        }
    }

    // `reiniciar` = true empieza por la primera página; si no, añade la siguiente
    function cargar(reiniciar) {
        var mio = ++ticket;
        var params = new URLSearchParams();
        params.set('estado', estado);
        var q = inputQ.value.trim();
        if (q) params.set('q', q);
        if (!reiniciar && siguiente) params.set('antes', siguiente);

        if (reiniciar) {
            listaEl.textContent = '';
            cargados = [];
            cajaLista.hidden = true;
            cajaMas.hidden = true;
            mostrarMensaje('Cargando…', false, false);
        }
        btnActualizar.disabled = true;
        btnMas.disabled = true;

        return api('/api/bandeja/lista?' + params.toString()).then(function (r) {
            if (mio !== ticket) return; // ya se pidió otra cosa
            btnActualizar.disabled = false;
            btnMas.disabled = false;
            if (!r.red && r.status === 401) { irALogin(); return; }
            if (r.red) {
                mostrarMensaje('No hemos podido conectar. Comprueba tu conexión e inténtalo de nuevo.', true, true);
                return;
            }
            if (r.status !== 200 || !r.json || !Array.isArray(r.json.items)) {
                mostrarMensaje((r.json && r.json.mensaje) || 'No hemos podido cargar la lista. Inténtalo de nuevo en un momento.', true, true);
                return;
            }
            ultimaCarga = Date.now();
            var items = r.json.items;
            for (var i = 0; i < items.length; i++) {
                cargados.push(items[i]);
                listaEl.appendChild(pintar(items[i]));
            }
            siguiente = r.json.siguiente || null;
            cajaMas.hidden = !siguiente;
            cajaLista.hidden = cargados.length === 0; // sin filas no hay tabla (ni su cabecera): solo el mensaje
            if (cargados.length === 0) mostrarMensaje('No hay tramitaciones que coincidan.', false, false);
            else estadoLista.hidden = true;
        });
    }

    function nuevaBusqueda() {
        siguiente = null;
        cargar(true);
    }

    // ---------- filtros ----------
    function pintarFiltros() {
        for (var i = 0; i < chips.length; i++) {
            chips[i].setAttribute('aria-pressed', chips[i].getAttribute('data-estado') === estado ? 'true' : 'false');
        }
    }

    function elegirFiltro(nuevo, guardar) {
        estado = nuevo;
        pintarFiltros();
        if (nuevo === 'descartadas') abrirMas(true);
        if (guardar) {
            try { sessionStorage.setItem('bandeja.estado', nuevo); } catch (e) { /* sin almacenamiento: no pasa nada */ }
            history.replaceState(null, '', nuevo === 'pendientes' ? '/bandeja' : '/bandeja?estado=' + nuevo);
            ponerEnlaceNombre();
        }
        nuevaBusqueda();
    }

    function abrirMas(abierto) {
        chipDescartadas.hidden = !abierto;
        chipMas.setAttribute('aria-expanded', abierto ? 'true' : 'false');
        chipMas.textContent = abierto ? 'Menos' : 'Más';
    }

    for (var i = 0; i < chips.length; i++) {
        chips[i].addEventListener('click', function () {
            elegirFiltro(this.getAttribute('data-estado'), true);
        });
    }
    chipMas.addEventListener('click', function () {
        abrirMas(chipDescartadas.hidden);
    });

    // ---------- Tarjetas / Lista ----------
    for (var v = 0; v < btnsVista.length; v++) {
        btnsVista[v].addEventListener('click', function () {
            elegirVista(this.getAttribute('data-vista'));
        });
    }

    // ---------- búsqueda ----------
    inputQ.addEventListener('input', function () {
        clearTimeout(temporizador);
        temporizador = setTimeout(nuevaBusqueda, 300);
    });
    inputQ.addEventListener('search', function () {
        clearTimeout(temporizador);
        nuevaBusqueda();
    });
    inputQ.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter') {
            clearTimeout(temporizador);
            nuevaBusqueda();
        }
    });

    btnMas.addEventListener('click', function () { cargar(false); });
    btnActualizar.addEventListener('click', nuevaBusqueda);

    var btnSalir = document.getElementById('btnSalir');
    btnSalir.addEventListener('click', function () {
        btnSalir.disabled = true;
        api('/api/bandeja/salir', {}).then(function (r) {
            if (!r.red && r.status === 200) { location.replace('/bandeja/entrar'); return; }
            // Si no se ha podido cerrar la sesión, no se hace como que sí: en un ordenador compartido sería un riesgo
            btnSalir.disabled = false;
            btnSalir.textContent = 'No se pudo salir. Reintentar';
        });
    });

    // Al volver a la pestaña después de un rato, se refresca solo; y «hace 12 min» se mantiene al día
    document.addEventListener('visibilitychange', function () {
        if (!document.hidden && ultimaCarga && Date.now() - ultimaCarga > 60000 && !inputQ.matches(':focus')) nuevaBusqueda();
    });
    setInterval(actualizarHoras, 60000);

    // Al volver atrás desde una ficha el navegador puede enseñar la lista tal como se quedó (caché de «atrás/adelante»), con
    // tarjetas que seguirían diciendo «Sin abrir» aunque ya se haya abierto: se vuelve a pedir, con el mismo filtro y búsqueda
    window.addEventListener('pageshow', function (ev) {
        if (ev.persisted) nuevaBusqueda();
    });

    // ---------- arranque ----------
    // «Quién soy»: sin sesión, al acceso; sin nombre, al paso del nombre (la lista se pide a la vez y no escribe nada, así que puede seguir)
    ponerEnlaceNombre();
    api('/api/bandeja/yo').then(function (r) {
        if (!r.red && r.status === 401) { irALogin(); return; }
        if (r.json && r.json.email) {
            if (!r.json.nombre) { irAlNombre(); return; }
            pintarQuien(r.json.nombre, r.json.email);
        }
    });

    var inicial = new URLSearchParams(location.search).get('estado');
    if (FILTROS.indexOf(inicial) === -1) {
        inicial = null;
        try { inicial = sessionStorage.getItem('bandeja.estado'); } catch (e) { /* idem */ }
        if (FILTROS.indexOf(inicial) === -1) inicial = 'pendientes';
    }
    estado = inicial;
    pintarFiltros();
    if (estado === 'descartadas') abrirMas(true);
    vista = leerVista();
    aplicarVista();
    cargar(true);
})();
</script>
</body>
</html>
