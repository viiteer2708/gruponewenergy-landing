<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <link rel="icon" type="image/png" href="/favicon-gnew.png">
    <title>Acceso a la bandeja | Grupo New Energy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary: #0B6E4F;
            --primary-dark: #094D38;
            --primary-light: #0D8A63;
            --bg: #F5F7FA;
            --card-bg: #FFFFFF;
            --text: #1A1A2E;
            --text-muted: #6B7280;
            --border: #E2E8F0;
            --error: #DC2626;
            --error-bg: #FEF2F2;
            --shadow-lg: 0 10px 25px -5px rgba(0,0,0,.1), 0 8px 10px -6px rgba(0,0,0,.07);
            --radius: 12px;
            --radius-sm: 8px;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .tarjeta {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: var(--shadow-lg);
            padding: 2rem 1.5rem 1.75rem;
        }

        .logo {
            display: block;
            width: 150px;
            height: auto;
            margin: 0 auto 1.5rem;
        }

        h1 {
            font-size: 1.35rem;
            line-height: 1.3;
            font-weight: 700;
            color: var(--primary-dark);
            text-align: center;
            margin-bottom: .5rem;
            letter-spacing: -.01em;
        }

        .intro {
            text-align: center;
            color: var(--text-muted);
            font-size: .95rem;
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-size: .875rem;
            font-weight: 600;
            margin-bottom: .35rem;
        }

        input {
            width: 100%;
            min-height: 48px;
            padding: .65rem .9rem;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font: inherit;
            font-size: 1rem; /* 16 px: el móvil no hace zoom al escribir */
            color: var(--text);
            background: #fff;
            transition: border-color .15s, box-shadow .15s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(11, 110, 79, .18);
        }

        input.codigo {
            text-align: center;
            font-size: 1.6rem;
            font-weight: 600;
            letter-spacing: .45em;
            padding-left: calc(.9rem + .45em); /* compensa el espacio que la separación deja a la derecha */
            font-variant-numeric: tabular-nums;
        }

        .error {
            margin-top: .6rem;
            padding: .6rem .8rem;
            border-radius: var(--radius-sm);
            background: var(--error-bg);
            border: 1px solid #FECACA;
            color: #991B1B;
            font-size: .875rem;
            line-height: 1.5;
        }

        .error[hidden], form[hidden] {
            display: none;
        }

        .aviso {
            padding: .75rem .9rem;
            margin-bottom: 1.1rem;
            border-radius: var(--radius-sm);
            background: #F0FAF6;
            border: 1px solid #D1EDE3;
            color: var(--primary-dark);
            font-size: .9rem;
            line-height: 1.5;
        }

        .btn {
            display: block;
            width: 100%;
            min-height: 48px;
            margin-top: 1rem;
            padding: .7rem 1rem;
            border: none;
            border-radius: var(--radius-sm);
            background: var(--primary);
            color: #fff;
            font: inherit;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background .15s;
        }

        .btn:hover:not(:disabled) {
            background: var(--primary-dark);
        }

        .btn:focus-visible, .enlace:focus-visible {
            outline: 3px solid rgba(249, 168, 37, .7);
            outline-offset: 2px;
        }

        .btn:disabled {
            opacity: .65;
            cursor: default;
        }

        .secundarios {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: .25rem 1.25rem;
            margin-top: 1rem;
        }

        .enlace {
            background: none;
            border: none;
            padding: .4rem .2rem;
            font: inherit;
            font-size: .875rem;
            font-weight: 600;
            color: var(--primary);
            cursor: pointer;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .enlace:disabled {
            opacity: .6;
            cursor: default;
        }

        .pie {
            margin-top: 1.5rem;
            text-align: center;
            font-size: .8rem;
            color: #9CA3AF;
        }
    </style>
</head>
<body>

<main class="tarjeta">
    <img class="logo" src="/logo-gnew.png" alt="Grupo New Energy">
    <h1>Acceso a la bandeja de tramitación</h1>

    <!-- Paso 1: el correo -->
    <form id="formCorreo" novalidate>
        <p class="intro">Escribe tu correo de trabajo y te enviaremos un código de 6 cifras.</p>
        <label for="email">Tu correo</label>
        <input id="email" name="email" type="email" inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false" placeholder="nombre@empresa.com" required>
        <p class="error" id="errorCorreo" role="alert" hidden></p>
        <button class="btn" id="btnCodigo" type="submit">Enviarme un código</button>
    </form>

    <!-- Paso 2: el código -->
    <form id="formCodigo" novalidate hidden>
        <p class="aviso" id="avisoCodigo" role="status"></p>
        <label for="codigo">Código de 6 cifras</label>
        <input id="codigo" class="codigo" name="codigo" type="text" inputmode="numeric" pattern="[0-9 ]*" autocomplete="one-time-code" maxlength="7" placeholder="······" required>
        <p class="error" id="errorCodigo" role="alert" hidden></p>
        <button class="btn" id="btnEntrar" type="submit">Entrar</button>
        <div class="secundarios">
            <button class="enlace" id="btnOtroCodigo" type="button">Pedir otro código</button>
            <button class="enlace" id="btnOtroCorreo" type="button">Usar otro correo</button>
        </div>
    </form>

    <p class="pie">Acceso solo para el equipo de tramitación.</p>
</main>

<script>
(function () {
    'use strict';

    var FRASE_CODIGO = 'Si tu correo tiene acceso, te hemos enviado un código de 6 cifras. Caduca en 10 minutos. Revisa también el spam.';
    var FRASE_RED = 'No hemos podido conectar. Comprueba tu conexión e inténtalo de nuevo.';
    var FRASE_CODIGO_NO_SALE = 'No hemos podido enviarte el código. Inténtalo de nuevo en un minuto.';

    var formCorreo = document.getElementById('formCorreo');
    var formCodigo = document.getElementById('formCodigo');
    var campoEmail = document.getElementById('email');
    var campoCodigo = document.getElementById('codigo');
    var errorCorreo = document.getElementById('errorCorreo');
    var errorCodigo = document.getElementById('errorCodigo');
    var btnCodigo = document.getElementById('btnCodigo');
    var btnEntrar = document.getElementById('btnEntrar');
    var btnOtroCodigo = document.getElementById('btnOtroCodigo');
    var btnOtroCorreo = document.getElementById('btnOtroCorreo');
    var avisoCodigo = document.getElementById('avisoCodigo');

    var correo = '';

    // A dónde volver tras entrar: solo páginas de la bandeja (nunca otra web)
    function destinoSeguro(valor) {
        if (typeof valor !== 'string' || valor.length > 300) return '/bandeja';
        if (!/^\/bandeja(?:[\/?#]|$)/.test(valor)) return '/bandeja';
        if (/[\\\u0000-\u001f\u007f]/.test(valor) || valor.indexOf('..') !== -1) return '/bandeja';
        return valor;
    }
    var volver = destinoSeguro(new URLSearchParams(location.search).get('volver'));

    function mostrarError(caja, texto) {
        caja.textContent = texto;
        caja.hidden = false;
    }
    function ocultarError(caja) {
        caja.textContent = '';
        caja.hidden = true;
    }

    // POST en JSON. Devuelve {status, json}; si no hay red, {red: true}. Nunca lanza.
    function llamar(ruta, cuerpo) {
        return fetch(ruta, {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(cuerpo)
        }).then(function (r) {
            return r.json().catch(function () { return null; }).then(function (json) {
                return { status: r.status, json: json };
            });
        }, function () {
            return { red: true };
        });
    }

    function frase(r, porDefecto) {
        return r && r.json && typeof r.json.mensaje === 'string' && r.json.mensaje ? r.json.mensaje : porDefecto;
    }

    function pasoCodigo(mensaje) {
        avisoCodigo.textContent = mensaje || FRASE_CODIGO;
        formCorreo.hidden = true;
        formCodigo.hidden = false;
        campoCodigo.value = '';
        ocultarError(errorCodigo);
        campoCodigo.focus();
    }

    function pasoCorreo() {
        formCodigo.hidden = true;
        formCorreo.hidden = false;
        ocultarError(errorCorreo);
        campoEmail.focus();
    }

    // Pide el código (la primera vez o «Pedir otro código»). `caja` es donde se enseña un fallo.
    function pedirCodigo(caja, boton, textoBoton) {
        ocultarError(caja);
        boton.disabled = true;
        boton.textContent = 'Enviando…';
        return llamar('/api/bandeja/codigo', { email: correo }).then(function (r) {
            boton.disabled = false;
            boton.textContent = textoBoton;
            if (r.red) { mostrarError(caja, FRASE_RED); return false; }
            if (r.status === 200) return true;
            mostrarError(caja, frase(r, FRASE_CODIGO_NO_SALE));
            return false;
        });
    }

    formCorreo.addEventListener('submit', function (ev) {
        ev.preventDefault();
        var valor = campoEmail.value.trim();
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(valor)) {
            mostrarError(errorCorreo, 'Escribe un correo electrónico válido.');
            campoEmail.focus();
            return;
        }
        correo = valor;
        pedirCodigo(errorCorreo, btnCodigo, 'Enviarme un código').then(function (ok) {
            if (ok) pasoCodigo();
        });
    });

    formCodigo.addEventListener('submit', function (ev) {
        ev.preventDefault();
        var codigo = campoCodigo.value.replace(/\s+/g, '');
        if (!/^\d{6}$/.test(codigo)) {
            mostrarError(errorCodigo, 'El código tiene 6 cifras.');
            campoCodigo.focus();
            return;
        }
        ocultarError(errorCodigo);
        btnEntrar.disabled = true;
        btnEntrar.textContent = 'Entrando…';
        llamar('/api/bandeja/entrar', { email: correo, codigo: codigo }).then(function (r) {
            if (!r.red && r.status === 200) {
                btnEntrar.textContent = 'Entrando…';
                location.replace(volver);
                return;
            }
            btnEntrar.disabled = false;
            btnEntrar.textContent = 'Entrar';
            mostrarError(errorCodigo, r.red ? FRASE_RED : frase(r, 'El código no es correcto o ha caducado. Pide uno nuevo.'));
            campoCodigo.select();
        });
    });

    btnOtroCodigo.addEventListener('click', function () {
        pedirCodigo(errorCodigo, btnOtroCodigo, 'Pedir otro código').then(function (ok) {
            if (ok) {
                avisoCodigo.textContent = FRASE_CODIGO;
                campoCodigo.value = '';
                campoCodigo.focus();
            }
        });
    });

    btnOtroCorreo.addEventListener('click', pasoCorreo);

    // Solo cifras (y los espacios con los que algunos teclados separan el código)
    campoCodigo.addEventListener('input', function () {
        var limpio = campoCodigo.value.replace(/[^\d ]/g, '');
        if (limpio !== campoCodigo.value) campoCodigo.value = limpio;
    });

    // En el móvil no se abre el teclado solo al entrar (taparía el título): solo con ratón
    if (window.matchMedia && window.matchMedia('(hover: hover)').matches) campoEmail.focus();
})();
</script>
</body>
</html>
